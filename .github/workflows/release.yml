name: Release VPM package
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vpm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check descriptor detection
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check update indicator behavior
        run: node tests/updates.test.js
      - name: Build package and merge listing history
        run: |
          echo "WARDROBE_VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          python3 scripts/build_release.py --live --version "1.0.$GITHUB_RUN_NUMBER"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$WARDROBE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p published
            gh release download "$tag" --pattern SHA256SUMS --dir published
            cmp dist/SHA256SUMS published/SHA256SUMS
          else
            gh release create "$tag" dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title "Avatar Wardrobe $tag" --notes-file RELEASE_NOTES.md --prerelease=false --latest
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy VPM listing
        id: deployment
        uses: actions/deploy-pages@v4
