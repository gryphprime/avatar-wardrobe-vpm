name: Release VPM package
# Packages are published only from version tags (v1.2.3) on main. Pushes to main
# validate and refresh the documentation site while keeping the live VPM listing.
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vpm-release
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got $TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG must point to a commit on main"
            exit 1
          fi
      - name: Build package and merge listing history
        # Uses the committed version; fails unless the tag, package.json and
        # Editor/WardrobeVersion.json all agree.
        run: python3 scripts/build_release.py --live --tag "$GITHUB_REF_NAME"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p published
            gh release download "$TAG" --pattern SHA256SUMS --dir published
            cmp dist/SHA256SUMS published/SHA256SUMS
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "Avatar Wardrobe $TAG" --notes-file RELEASE_NOTES.md --prerelease=false --latest
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy VPM listing
        id: deployment
        uses: actions/deploy-pages@v4
  docs:
    if: github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve live VPM listing
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path
          # Bypass the Pages CDN cache so a release deployed moments ago is kept.
          url = 'https://gryphprime.github.io/avatar-wardrobe-vpm/index.json?t=%d' % time.time()
          with urllib.request.urlopen(url, timeout=30) as response:
              listing = json.load(response)
          if listing.get('id') != 'dev.gryphprime.avatar-wardrobe.listing' or not listing.get('packages'):
              raise ValueError('Unexpected live VPM listing; refusing to replace it')
          Path('docs/index.json').write_text(json.dumps(listing, indent=2) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
